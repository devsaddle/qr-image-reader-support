<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图中扫码 · 示例图片</title><link rel="stylesheet" href="assets/result.css"></head><body class="policy"><header><div class="brand"><img src="assets/icon48.png" alt=""><strong>图中扫码 · 示例图片</strong></div></header><main><h1>在图片上右键试一试</h1><p>安装插件后，在下方图片上右键，选择「识别图片中的二维码」。也可以保存图片后通过插件图标选择文件。示例不需要登录，不包含私密数据。</p><h2>网页链接</h2><img src="assets/example-link.png" width="300" height="300" alt="指向 example.com 的示例二维码"><p>预期内容：<code>https://example.com/qr?from=chrome&amp;lang=zh</code>。链接由你手动决定是否打开。</p><h2>一张图片中的两个二维码</h2><img src="assets/example-multiple.png" width="680" height="340" style="max-width:100%;height:auto" alt="一个网页链接和一段中文文字的双二维码示例"><p>预期得到两条不同内容：上面的网页链接，以及「你好，二维码！这是一段中文内容。」（中间包含换行）。</p><p><a href="index.html">返回使用帮助</a> · <a href="privacy.html">隐私政策</a></p></main></body></html>
